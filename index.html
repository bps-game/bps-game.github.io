<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050507" />
  <meta name="color-scheme" content="dark" />
  <title>BetterPopsauce — quiz entre amis</title>
  <meta name="description" content="Quiz de culture générale multijoueur en temps réel, gratuit et sans compte." />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <div class="brand">
      <h1><span class="glitch" data-text="BetterPopsauce">BetterPopsauce</span></h1>
    </div>

    <div id="screen-home" class="screen active">
      <div class="card">
        <div class="tabs" id="home-tabs">
          <div class="tab-indicator" id="tab-indicator"></div>
          <div class="tab active" data-tab="create">Créer une partie</div>
          <div class="tab" data-tab="join">Rejoindre</div>
        </div>

        <div id="panel-create" class="tab-panel" style="margin-top: 16px">
          <button class="btn-primary" id="btn-create-room">Créer la partie</button>
        </div>

        <div id="panel-join" class="tab-panel" style="display: none; margin-top: 16px">
          <div class="field">
            <label for="join-code">Code de la partie</label>
            <input type="text" id="join-code" class="code-input" maxlength="12" placeholder="BPS-XXXXX" />
          </div>
          <button class="btn-primary" id="btn-join-room">Rejoindre</button>
        </div>

        <p class="error-msg" id="home-error"></p>
      </div>
    </div>

    <div id="screen-lobby" class="screen">
      <div class="card">
        <div class="room-code-display">
          <div class="hint" id="lobby-code-label">Code de la partie à partager</div>
          <div class="code" id="lobby-code">—</div>
        </div>
        <div class="player-list" id="lobby-players"></div>

        <div class="lobby-settings-row">
          <div class="lobby-setting-block">
            <label class="hint" for="win-score-input">Score pour gagner la partie</label>
            <div class="lobby-setting-row">
              <input type="number" id="win-score-input" class="lobby-setting-input" min="1" max="2000" step="10" style="display: none" />
              <span class="lobby-setting-value" id="win-score-value"></span>
              <span class="hint">pts</span>
            </div>
          </div>
          <div class="lobby-setting-block">
            <label class="hint" for="time-limit-input">Temps par question</label>
            <div class="lobby-setting-row">
              <input type="number" id="time-limit-input" class="lobby-setting-input" min="3" max="120" step="1" style="display: none" />
              <span class="lobby-setting-value" id="time-limit-value"></span>
              <span class="hint">s</span>
            </div>
          </div>
        </div>

        <p class="hint" id="lobby-hint">En attente que l'hôte démarre la partie…</p>
        <button class="btn-primary" id="btn-start-game" style="display: none">Démarrer la partie</button>
      </div>
    </div>

    <div id="screen-question" class="screen with-sidebar">
      <div class="question-layout">
        <div class="card question-card" id="question-card">
          <div class="progress-row">
            <span id="question-progress"></span>
            <span id="question-category"></span>
          </div>
          <div class="timer-bar"><div class="timer-bar-fill" id="timer-fill"></div></div>
          <p class="question-text" id="question-text"></p>
          <img id="question-media-image" class="question-image" style="display: none" alt="" />
          <video
            id="question-media-video"
            class="question-image question-video"
            style="display: none"
            playsinline
          ></video>
          <iframe
            id="question-media-youtube"
            class="question-image question-youtube"
            style="display: none"
            frameborder="0"
            allow="autoplay; encrypted-media"
            title="Vidéo YouTube de la question"
          ></iframe>
          <blockquote class="question-quote" id="question-media-quote" style="display: none"></blockquote>
          <div id="libre-area">
            <div class="field answer-field-wrap">
              <div class="answer-input-shell">
                <input
                  type="text"
                  id="libre-input"
                  class="answer-input-real"
                  placeholder="Ta réponse… (Entrée pour valider)"
                  autocomplete="off"
                  enterkeyhint="send"
                />
                <div class="answer-input-display" id="answer-display" aria-hidden="true">
                  <span id="answer-display-inner"></span>
                </div>
              </div>
            </div>
          </div>
          <p class="answer-status" id="answer-status" style="display: none"></p>
        </div>
        <aside class="card scoreboard-panel">
          <h3 class="scoreboard-title" id="scoreboard-title">Scores</h3>
          <div class="scoreboard-list" id="live-scoreboard"></div>
          <div class="chat-panel">
            <div class="chat-messages" id="chat-messages"></div>
            <div class="chat-input-row">
              <input type="text" id="chat-input" maxlength="140" placeholder="Message…" autocomplete="off" />
              <button class="chat-send-btn" id="btn-chat-send" aria-label="Envoyer">➤</button>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <div id="screen-reveal" class="screen">
      <div class="card">
        <div class="reveal-banner" id="reveal-banner"></div>
        <div class="correct-answer-block">
          <div class="correct-answer-label">La bonne réponse</div>
          <div class="correct-answer-reveal" id="correct-answer-reveal">
            <span class="correct-answer-big" id="correct-answer-text"></span>
            <div class="answer-tooltip" id="correct-answer-tooltip">
              <div class="answer-tooltip-title">Réponses acceptées</div>
              <div class="answer-tooltip-list" id="correct-answer-tooltip-list"></div>
            </div>
          </div>
        </div>
        <h3 class="hint">Classement</h3>
        <div class="leaderboard" id="reveal-leaderboard"></div>
      </div>
    </div>

    <div id="screen-end" class="screen">
      <div class="card">
        <h2 style="text-align: center; margin-top: 0">🏆 Résultats finaux</h2>
        <p class="end-banner" id="end-banner"></p>
        <div class="podium" id="end-podium"></div>
        <div class="leaderboard" id="end-leaderboard"></div>
        <button class="btn-secondary" id="btn-restart" style="margin-top: 14px">Retour à l'accueil</button>
      </div>
    </div>

  </div>

  <button class="mute-btn" id="btn-mute" title="Couper/activer le son" aria-label="Couper ou activer le son">🔊</button>

  <div class="account-widget" id="account-widget">
    <button class="account-btn" id="btn-account-signin">Se connecter avec Google</button>
    <div class="account-pseudo-form" id="account-pseudo-form" style="display: none">
      <input type="text" id="account-pseudo-input" maxlength="24" placeholder="Choisis ton pseudo" autocomplete="off" />
      <button class="account-btn" id="btn-account-pseudo-save">OK</button>
    </div>
    <div class="account-signed-in" id="account-signed-in" style="display: none">
      <span class="account-name" id="account-name"></span>
      <button class="account-rename" id="btn-account-rename" title="Changer de pseudo" aria-label="Changer de pseudo">✏️</button>
      <a class="account-link" href="editor.html">📝 Proposer une question</a>
      <button class="account-signout" id="btn-account-signout">Déconnexion</button>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>
  <div class="toast" id="toast"></div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/peer-network.js"></script>
  <script src="js/game-engine.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/media.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
  <script type="module" src="js/account-widget.js"></script>
</body>
</html>
